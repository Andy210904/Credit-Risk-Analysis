    <script>
      // --- Global State and Constants ---
      const RAG_THRESHOLDS = {
        RED_MAX: 50, // High Risk: 0% to 50% Approval
        AMBER_MAX: 80, // Moderate Risk: 51% to 80% Approval
        GREEN_MAX: 100, // Low Risk: 81% to 100% Approval
      };
      // When opened via filesystem (file://) relative fetch('/api/...') fails.
      // Use explicit backend base (adjust port if needed)
      const API_BASE = "http://localhost:8000";

      // Mock thresholds for factor analysis (for interpretability/reasoning)
      const MOCK_THRESHOLDS = {
        ebitda_margin_pct: {
          low: 20,
          high: 10,
          compare: ">",
          unit: "%",
          risk: "lower",
        }, // Good if > 20
        debt_to_equity: {
          low: 0.5,
          high: 2.0,
          compare: "<",
          unit: "x",
          risk: "higher",
        }, // Good if < 0.5
        current_ratio: {
          low: 2.0,
          high: 1.0,
          compare: ">",
          unit: "x",
          risk: "lower",
        }, // Good if > 2.0
        country_risk_0_100: {
          low: 70,
          high: 30,
          compare: ">",
          unit: "/100",
          risk: "lower",
        }, // Good if > 70 (lower risk score means lower risk)
        collateral_coverage_pct: {
          low: 100,
          high: 80,
          compare: ">",
          unit: "%",
          risk: "lower",
        }, // Good if > 100
        payment_incidents_12m: {
          low: 0,
          high: 2,
          compare: "<",
          unit: " count",
          risk: "higher",
        }, // Good if = 0
      };

      let currentRiskResult = null;
      let currentPage = "Dashboard";
      let applicationHistory = []; // Dynamic array to store processed applications
      let batchFileData = null; // Stores data read from file upload, awaiting analysis button click
      const PROTECTED_PAGES = new Set([
        "Dashboard",
        "ApplicationUpload",
        "RiskEvaluation",
        "Reports",
        "Settings",
      ]);

      // --- AUTHENTICATION STATE MANAGEMENT ---

        isLoggedIn: false,
        userName: "Guest",
        userInitials: "G",
        userEmail: "",
        // Mock credentials for simple demo login
        mockID: "analyst123",
        mockPass: "securepass",
        mockUsers: {
          analyst123: {
            pass: "securepass",
            name: "John Doe",
            email: "john.doe@risk.com",
          },
        },
      };

      function loadUserState() {
        const storedState = sessionStorage.getItem("riskGaugeUserState");
        if (storedState) {
          userState = JSON.parse(storedState);
          if (!userState.mockUsers) {
            userState.mockUsers = {
              analyst123: {
                pass: "securepass",
                name: "John Doe",
                email: "john.doe@risk.com",
              },
            };
          }
        }
      }

      function saveUserState() {
        sessionStorage.setItem("riskGaugeUserState", JSON.stringify(userState));
      }

      // Mock Firebase variables (required for environment setup)
      const appId =
        typeof __app_id !== "undefined"
          ? __app_id
          : "default-credit-risk-app-id";
      const firebaseConfig =
        typeof __firebase_config !== "undefined"
          ? JSON.parse(__firebase_config)
          : {};

      // --- Mock Data (Single Sample Input) ---
      // This is the default data loaded into the form
      const SAMPLE_INPUT = {
        ebitda_margin_pct: 15.2,
        ebit_margin_pct: 10.5,
        debt_to_equity: 0.8,
        interest_coverage: 3.2,
        dscr: 1.5,
        current_ratio: 2.1,
        quick_ratio: 1.8,
        revenue_usd_m: 250,
        years_in_operation: 15,
        governance_score_0_100: 85,
        country_risk_0_100: 40,
        collateral_coverage_pct: 120,
        payment_incidents_12m: 0,
      };

      const FIELD_LABELS = {
        entity_id: "Entity ID",
        entity_name: "Entity Name",
        ebitda_margin_pct: "EBITDA Margin (%)",
        ebit_margin_pct: "EBIT Margin (%)",
        debt_to_equity: "Debt to Equity Ratio",
        interest_coverage: "Interest Coverage",
        dscr: "DSCR (Debt Service Coverage Ratio)",
        current_ratio: "Current Ratio",
        quick_ratio: "Quick Ratio",
        revenue_usd_m: "Revenue (USD M)",
        years_in_operation: "Years in Operation",
        governance_score_0_100: "Governance Score (0-100)",
        country_risk_0_100: "Country Risk (0-100)",
        collateral_coverage_pct: "Collateral Coverage (%)",
        payment_incidents_12m: "Payment Incidents (12M)",
      };

      // Filter for essential inputs for the simpler form
      const essentialFields = [
        "debt_to_equity",
        "dscr",
        "current_ratio",
        "ebitda_margin_pct",
        "revenue_usd_m",
        "years_in_operation",
        "governance_score_0_100",
        "country_risk_0_100",
        "collateral_coverage_pct",
        "payment_incidents_12m",
      ];

      // Fields to display in the batch preview table
      const previewFields = ["entity_id", "entity_name", ...essentialFields];

      // --- Risk Evaluation Logic (previously used and relied on elsewhere) ---
      function evaluateRisk(inputData) {
        const factors = [];
        let highRiskCount = 0;
        let lowRiskCount = 0;

        const keysToCheck = essentialFields; // limit analysis to essential fields
        keysToCheck.forEach((key) => {
          const value = inputData[key];
          const rule = MOCK_THRESHOLDS[key];
          let evaluation = "Medium";

          if (rule && typeof value === "number") {
            if (rule.compare === ">") {
              if (value >= rule.low) {
                evaluation = "Low";
                lowRiskCount++;
              } else if (value <= rule.high) {
                evaluation = "High";
                highRiskCount++;
              }
            } else if (rule.compare === "<") {
              if (value <= rule.low) {
                evaluation = "Low";
                lowRiskCount++;
              } else if (value >= rule.high) {
                evaluation = "High";
                highRiskCount++;
              }
            }
          }

          factors.push({
            factor: key,
            evaluation,
            value,
          });
        });

        let finalEvaluation = "Low";
        let approvalPredictionPct = 85;
        if (highRiskCount >= 2 || highRiskCount > lowRiskCount) {
          finalEvaluation = "Red";
          approvalPredictionPct = Math.floor(Math.random() * 40) + 10; // 10 - 49
        } else if (highRiskCount === 1) {
          finalEvaluation = "Amber";
          approvalPredictionPct = Math.floor(Math.random() * 25) + 55; // 55 - 79
        } else {
          finalEvaluation = "Low";
          approvalPredictionPct = Math.floor(Math.random() * 20) + 81; // 81 - 100
        }

        const summary =
          finalEvaluation === "Red"
            ? "The application presents **High Risk (Red)** with multiple adverse indicators. Rejection recommended."
            : finalEvaluation === "Amber"
            ? "The application presents **Moderate Risk (Amber)**. Manual review advised."
            : "The application presents **Low Risk (Green)**. Eligible for fast-track approval.";

        return {
          factors,
          summary,
          final_evaluation: finalEvaluation,
          approval_prediction_pct: approvalPredictionPct,
          applicant_id:
            inputData.entity_id ||
            "CUS-" + (Math.floor(Math.random() * 90000) + 10000),
          input_data: inputData,
        };
      }

      // Helper function for CSV parsing
      function parseCSV(csvText) {
        const lines = csvText.trim().split("\n");
        if (lines.length < 2) return [];

        const headers = lines[0].split(",").map((h) => h.trim());
        const data = [];

        for (let i = 1; i < lines.length; i++) {
          const values = lines[i].split(",").map((v) => v.trim());
          if (values.length === headers.length) {
            let client = {};
            headers.forEach((header, index) => {
              let value = values[index];
              // Convert numeric fields based on expected keys
              if (!isNaN(parseFloat(value))) {
                client[header] = parseFloat(value);
              } else {
                client[header] = value;
              }
            });
            data.push(client);
          }
        }
        return data;
      }

      // --- NEW: Individual Evaluation Handler ---
      async function handleIndividualEvaluation(clientData) {
        if (!userState.isLoggedIn) {
          showTemporaryMessage(
            "Please log in to evaluate applications.",
            "red"
          );
          renderPage("Login");
          return;
        }
        // Use the client data and send it to the mock ML model
        showTemporaryMessage(
          "Sending individual request to ML model...",
          "blue"
        );
        // Simulate latency, then process
        setTimeout(async () => {
          try {
            const result = evaluateRisk(clientData);
            currentRiskResult = result;

            const status =
              result.final_evaluation === "Red"
                ? "Rejected"
                : result.final_evaluation === "Amber"
                ? "Under Review"
                : "Accepted";

            applicationHistory.push({
              id: result.applicant_id,
              date: new Date().toLocaleDateString("en-US", {
                year: "numeric",
                month: "short",
                day: "numeric",
              }),
              risk: result.final_evaluation,
              score: result.approval_prediction_pct,
              status,
              color:
                result.final_evaluation === "Low"
                  ? "green"
                  : result.final_evaluation === "Amber"
                  ? "yellow"
                  : "red",
            });

            showTemporaryMessage(
              "ML Analysis Complete! See the Risk Evaluation page.",
              "green"
            );
            await renderPage("RiskEvaluation");
          } catch (err) {
            console.error("Evaluation Error:", err);
            showTemporaryMessage("Evaluation failed.", "red");
          }
        }, 800);
      }

      // New function to handle file reading and storage
      async function handleFileSelection(file) {
        if (!file) return;

        console.log("handleFileSelection called with:", file.name);
        const fileType = file.name.split(".").pop().toLowerCase();
        const uploadBtn = document.getElementById("analyze-batch-btn");
        const fileNameDisplay = document.getElementById("file-name-display");

        if (fileType !== "csv" && fileType !== "json") {
          showTemporaryMessage(
            "Unsupported file type. Please use CSV or JSON.",
            "red"
          );
          return;
        }

        // Use backend API for file upload
        console.log(
          "Checking handleFileSelectionAPI function:",
          typeof handleFileSelectionAPI
        );
        if (typeof handleFileSelectionAPI === "function") {
          console.log("Using backend API for file upload");
          // Call the backend API function from api-integration.js
          handleFileSelectionAPI(file, uploadBtn, fileNameDisplay);
        } else {
          console.log("Backend API not available, using local processing");
          // Fallback to local processing if API not available
          await handleFileSelectionLocal(file);
        }
      }

      // Local file handling as fallback
      async function handleFileSelectionLocal(file) {
        const fileType = file.name.split(".").pop().toLowerCase();
        const uploadBtn = document.getElementById("analyze-batch-btn");
        const fileNameDisplay = document.getElementById("file-name-display");

        // Disable analyze button until loading complete
        if (uploadBtn) uploadBtn.disabled = true;
        if (fileNameDisplay) fileNameDisplay.textContent = "Reading file...";

        const reader = new FileReader();
        reader.onload = function (e) {
          let clientsData = [];
          try {
            const contents = e.target.result;
            if (fileType === "json") {
              clientsData = JSON.parse(contents);
              if (!Array.isArray(clientsData)) clientsData = [clientsData]; // Handle single JSON object
            } else if (fileType === "csv") {
              clientsData = parseCSV(contents);
            }

            batchFileData = clientsData;
            // Store the filename for display in the preview
            batchFileData.file = file.name;

            if (fileNameDisplay)
              fileNameDisplay.textContent = `${file.name} (${clientsData.length} clients loaded)`;
            if (uploadBtn) {
              uploadBtn.disabled = clientsData.length === 0;
              uploadBtn.textContent = `Show Data Preview (${clientsData.length} Clients)`;
            }
            showTemporaryMessage(
              `File loaded: ${clientsData.length} applications ready for preview.`,
              "blue"
            );

            // Re-render the application upload page to show the new preview table
            renderPage("ApplicationUpload");
          } catch (error) {
            batchFileData = null;
            if (fileNameDisplay)
              fileNameDisplay.textContent = "Error during file parsing.";
            if (uploadBtn) {
              uploadBtn.disabled = true;
              uploadBtn.textContent = "Show Data Preview (0 Clients)";
            }
            showTemporaryMessage(
              "Error parsing " + fileType.toUpperCase() + " file.",
              "red"
            );
          }
        };
        reader.readAsText(file);
      }

      // --- AUTHENTICATION FUNCTIONS ---
      function handleLogin(event) {
        event.preventDefault();
        const form = event.target;

        const userID = form.elements["userID"].value.trim();
        const password = form.elements["password"].value.trim();

        // Mocked authentication check
        if (
          userState.mockUsers[userID] &&
          userState.mockUsers[userID].pass === password
        ) {
          // Set session user details from the stored mock user data
          userState.isLoggedIn = true;
          userState.userName = userState.mockUsers[userID].name;
          userState.userEmail = userState.mockUsers[userID].email;
          userState.userInitials = userState.userName
            .substring(0, 1)
            .toUpperCase();

          saveUserState();
          showTemporaryMessage(`Welcome back, ${userState.userName}!`, "green");
          renderPage("Dashboard");
        } else {
          showTemporaryMessage(
            "Invalid Analyst ID or Password. Check credentials.",
            "red"
          );
        }
      }

      function handleRegister(event) {
        event.preventDefault();
        const form = event.target;

        const userID = form.elements["newUserID"].value.trim();
        const password = form.elements["newPassword"].value.trim();
        const userName =
          form.elements["newUserName"].value.trim() || "New Analyst";
        const userEmail =
          form.elements["newUserEmail"].value.trim() || "newuser@risk.com";

        if (userState.mockUsers[userID]) {
          showTemporaryMessage(
            "User ID already exists. Please choose another.",
            "red"
          );
          return;
        }

        // Mocked registration (saving to session state)
        userState.mockUsers[userID] = {
          pass: password,
          name: userName,
          email: userEmail,
        };
        userState.isLoggedIn = true;
        userState.userName = userName;
        userState.userEmail = userEmail;
        userState.userInitials = userName.substring(0, 1).toUpperCase();

        saveUserState();
        showTemporaryMessage(`Account created! Welcome, ${userName}!`, "green");
        renderPage("Dashboard");
      }

      function handleLogout() {
        userState.isLoggedIn = false;
        userState.userName = "Guest";
        userState.userInitials = "G";
        userState.userEmail = "";
        saveUserState();
        showTemporaryMessage("Logged out successfully.", "blue");
        renderPage("Login");

                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3v-4a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>

      // Global variable to store backend dashboard stats
      let backendDashboardStats = null;

      async function loadDashboardStatsFromBackend() {
        // Check if backend API is available
        if (typeof getDashboardStatsFromBackend === "function") {
          try {
            const stats = await getDashboardStatsFromBackend();
            if (stats) {
              backendDashboardStats = stats;
              return stats;
            }
          } catch (error) {
            console.error("Error loading dashboard stats from backend:", error);
          }
        }

        // Fallback to local calculation if backend fails
        return calculateLocalDashboardStats();
      }

      function calculateLocalDashboardStats() {
        const totalApps = applicationHistory.length;

        // Calculate Accepted, Reviewed, Rejected
        const acceptedCount = applicationHistory.filter(
          (h) => h.status === "Accepted"
        ).length;
        const reviewedCount = applicationHistory.filter(
          (h) => h.status === "Under Review"
        ).length;
        const rejectedCount = applicationHistory.filter(
          (h) => h.status === "Rejected"
        ).length;

        // Calculate percentages
        const acceptedPct =
          totalApps > 0 ? ((acceptedCount / totalApps) * 100).toFixed(1) : 0;
        const rejectedPct =
          totalApps > 0 ? ((rejectedCount / totalApps) * 100).toFixed(1) : 0;
        const reviewedPct =
          totalApps > 0 ? ((reviewedCount / totalApps) * 100).toFixed(1) : 0;

        // Distribution percentages (RAG)
        const lowRiskCount = applicationHistory.filter(
          (h) => h.risk === "Low"
        ).length;
        const amberRiskCount = applicationHistory.filter(
          (h) => h.risk === "Amber"
        ).length;
        const redRiskCount = rejectedCount;

        const lowPct =
          totalApps > 0 ? ((lowRiskCount / totalApps) * 100).toFixed(1) : 0;
        const amberPct =
          totalApps > 0 ? ((amberRiskCount / totalApps) * 100).toFixed(1) : 0;
        const redPct =
          totalApps > 0 ? ((redRiskCount / totalApps) * 100).toFixed(1) : 0;

        return {
          total_applications_processed: totalApps,
          total_accepted: acceptedCount,
          under_review_manual: reviewedCount,
          total_rejected: rejectedCount,
          accepted_percentage: parseFloat(acceptedPct),
          under_review_percentage: parseFloat(reviewedPct),
          rejected_percentage: parseFloat(rejectedPct),
          low_risk_count: lowRiskCount,
          moderate_risk_count: amberRiskCount,
          high_risk_count: redRiskCount,
          low_risk_percentage: parseFloat(lowPct),
          moderate_risk_percentage: parseFloat(amberPct),
          high_risk_percentage: parseFloat(redPct),
          status_check: "OK",
          last_updated: new Date().toISOString(),
        };
      }

      /**
       * Renders the Risk Evaluation page with the RAG Gauge and factor table.
       * @param {object} result - The risk assessment result from the evaluation function.
       */
      function renderRiskEvaluation(result) {
        const riskLevel = result.final_evaluation; // Red, Amber, or Medium (Amber)
        const approvalPct = result.approval_prediction_pct;

        let colorClass = "text-red-600 bg-red-100";
        let rotationDeg = 0; // 0 to 180 degrees mapping to 0% to 100%

        // Calculate rotation for the needle (0% -> 0deg, 100% -> 180deg)
        rotationDeg = (approvalPct / 100) * 180;
        // Ensure rotation stays within 0 to 180 degrees
        rotationDeg = Math.min(180, Math.max(0, rotationDeg));

        if (approvalPct > RAG_THRESHOLDS.AMBER_MAX) {
          colorClass = "text-green-600 bg-green-100";
        } else if (approvalPct > RAG_THRESHOLDS.RED_MAX) {
          colorClass = "text-yellow-600 bg-yellow-100";
        } else {
          colorClass = "text-red-600 bg-red-100";
        }

        // Generate the table rows for factors
        const factorRows = result.factors
          .map((f) => {
            let cellColor = "";
            if (f.evaluation === "Low")
              cellColor = "bg-green-100 text-green-700";
            if (f.evaluation === "Medium")
              cellColor = "bg-yellow-100 text-yellow-700";
            if (f.evaluation === "High") cellColor = "bg-red-100 text-red-700";

            const label = FIELD_LABELS[f.factor] || f.factor;

            let comparisonText = "Rule Not Defined";
            const rule = MOCK_THRESHOLDS[f.factor];
            if (rule) {
              const thresholdType = rule.compare === ">" ? "Above" : "Below";
              const riskOutcome = rule.compare === ">" ? "Higher" : "Lower";
              comparisonText =
                thresholdType +
                " " +
                rule.low +
                rule.unit +
                " for " +
                riskOutcome +
                " Risk";
            }

            return (
              "" +
              '<tr class="hover:bg-gray-50 transition duration-100">' +
              '<td class="p-4 whitespace-nowrap text-sm font-medium text-gray-800">' +
              label +
              "</td>" +
              '<td class="p-4 whitespace-nowrap text-sm text-gray-600">' +
              f.value +
              "</td>" +
              '<td class="p-4 whitespace-nowrap text-sm text-gray-600">' +
              comparisonText +

      // Helper function to attach event listeners dynamically
      function setupDynamicListeners(pageName) {
        // Hide sidebar on Login/Register page
        const sidebar = document.getElementById("sidebar");
        const mainContent = document.querySelector(".main-content");
        const authPages = ["Login", "Register"];

        if (authPages.includes(pageName)) {
          sidebar.classList.add("hidden");
          mainContent.classList.add("w-full");
        } else {
          sidebar.classList.remove("hidden");
          mainContent.classList.remove("w-full");
        }

        // Re-attach listeners for common buttons
        if (pageName === "RiskEvaluation" && !currentRiskResult) {
          const startBtn = document.getElementById("start-new-evaluation-btn");
          if (startBtn) {
            startBtn.addEventListener("click", async (e) => {
              e.preventDefault();
              await renderPage("ApplicationUpload");
            });
          }
        }
        if (pageName === "Reports") {
          const startBtnReport = document.getElementById(
            "start-new-evaluation-btn-report"
          );
          if (startBtnReport) {
            startBtnReport.addEventListener("click", async (e) => {
              e.preventDefault();
              await renderPage("ApplicationUpload");
            });
          }
        }
        if (pageName === "ApplicationUpload") {
          const loadBtn = document.getElementById("manual-load-clients");
          if (loadBtn) {
            loadBtn.addEventListener("click", async (e) => {
              e.preventDefault();
              showTemporaryMessage("Fetching clients from backend...", "blue");
              await initializeClientList(true);
            });
          }
        }

        // Attach form handlers to the newly rendered forms
        if (pageName === "Login") {
          document.getElementById("login-form").onsubmit = handleLogin;
        }
        if (pageName === "Register") {
          document.getElementById("register-form").onsubmit = handleRegister;
        }

        // --- BATCH PROCESSING LISTENERS ---
        if (pageName === "ApplicationUpload") {
          const fileSelectBtn = document.getElementById("file-select-btn");
          const fileInput = document.getElementById("file-input");
          const analyzeBatchBtn = document.getElementById("analyze-batch-btn");
          const dropArea = document.getElementById("drop-area");

          if (fileSelectBtn && fileInput) {
            // Clicking "Or Select File" triggers file dialog
            fileSelectBtn.addEventListener("click", (e) => {
              e.preventDefault();
              fileInput.click();
            });

            // File is selected, load it into memory (batchFileData)
            fileInput.onchange = (e) => {
              if (e.target.files.length > 0) {
                handleFileSelection(e.target.files[0]);
              }
            };
          }

          // Drop area listeners (guard if element exists)
          if (dropArea) {
            ["dragenter", "dragover", "dragleave", "drop"].forEach(
              (eventName) => {
                dropArea.addEventListener(eventName, preventDefaults, false);
              }
            );
            dropArea.addEventListener("drop", handleDrop, false);
          }
          function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
          }
          function handleDrop(e) {
            let dt = e.dataTransfer;
            let files = dt.files;
            if (files.length > 0) {
              handleFileSelection(files[0]);
            }
          }

          // Clicking "Analyze Batch" button triggers processing
          if (analyzeBatchBtn) {
            analyzeBatchBtn.addEventListener("click", (e) => {
              e.preventDefault();
              console.log("Upload & Append button clicked");
              console.log(
                "Backend upload data present:",
                Array.isArray(batchFileData) ? batchFileData.length : 0
              );

              // If we have freshly uploaded backend data (batchFileData) append it to cache
              if (Array.isArray(batchFileData) && batchFileData.length > 0) {
                // Mark all as upload source then merge
                try {
                  appendUploadedClientsToCache(
                    batchFileData.map((c) => ({ ...c, _source: "upload" }))
                  );
                  showTemporaryMessage(
                    "Appended " +
                      batchFileData.length +
                      " uploaded clients to session list.",
                    "green"
                  );
                } catch (err) {
                  console.error("Error appending uploaded clients:", err);
                }
              }

              // Always refresh from backend to ensure DB count (e.g., 700 rows) is visible
              initializeClientList(true).then(() => {
                console.log("Client list refreshed after upload");
              });
            });
          }

          // Form submission listener remains the same
          const form = document.getElementById("risk-evaluation-form");
          if (form) {
            form.onsubmit = handleFormSubmission;
          }
        }
      }

      // --- Utility Functions (simplified) ---
      async function renderPage(pageName) {
        if (PROTECTED_PAGES.has(pageName) && !userState.isLoggedIn) {
          pageName = "Login";
        }
        currentPage = pageName;
        const contentDiv = document.getElementById("app-content");
        const titleDiv = document.getElementById("page-title");
        const menuItems = document.querySelectorAll(".menu-item");

        // Render Header (including auth status) before rendering content
        renderHeader();

        // Update active menu item
        menuItems.forEach((item) => {
          item.classList.remove("active");
        });
        const activeItem = Array.from(menuItems).find(
          (item) => item.getAttribute("data-page") === pageName
        );
        // Only highlight menu item if it's not Login or Register
        if (activeItem && !["Login", "Register"].includes(pageName)) {
          activeItem.classList.add("active");
        }

        titleDiv.textContent = pageName.replace(/([A-Z])/g, " $1").trim();

        let pageContent;
        switch (pageName) {
          case "Dashboard":
            pageContent = await renderDashboard();
            break;
          case "ApplicationUpload":
            pageContent = renderApplicationUpload();
            break;
          case "RiskEvaluation":
            pageContent = currentRiskResult
              ? renderRiskEvaluation(currentRiskResult)
              : renderEmptyEvaluation();
            break;
          case "Reports":
            pageContent = renderReports();
            break;
          case "Settings":
            pageContent =
              '<div class="bg-white p-16 rounded-2xl shadow-xl text-center"><h2 class="text-2xl font-bold text-gray-800 mb-4">' +
              pageName +
              ' Page</h2><p class="text-gray-600">Content for the ' +
              pageName +
              " section will be implemented here.</p></div>";
            break;
          case "Login":
            pageContent = renderLogin();
            break;
          case "Register":
            pageContent = renderRegister();
            break;
        }
        contentDiv.innerHTML = pageContent;
        window.scrollTo(0, 0);

        // Re-attach listeners after rendering dynamic content
        setupDynamicListeners(pageName);
      }

      async function handleFormSubmission(event) {
        if (!userState.isLoggedIn) {
          showTemporaryMessage("Please log in to submit applications.", "red");
          renderPage("Login");
          return;
        }
        event.preventDefault();
        const form = event.target;
        const formData = {};

        // Collect data from number inputs
        document
          .querySelectorAll('#risk-evaluation-form input[type="number"]')
          .forEach((input) => {
            formData[input.id] = parseFloat(input.value);
          });

        const submitButton = form.querySelector('button[type="submit"]');
        submitButton.innerHTML =
          '<svg class="animate-spin w-5 h-5 mr-2 text-white" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-miterlimit="10" stroke-dasharray="80" stroke-dashoffset="60" style="stroke-opacity: 0.25;"></circle><path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Analyzing...';
        submitButton.disabled = true;

        setTimeout(async () => {
          try {
            // Use the captured form data for evaluation
            const result = evaluateRisk(formData);
            currentRiskResult = result;

            // Determine final status
            // FIX 2: Amber is now 'Under Review'
            const status =
              result.final_evaluation === "Red"
                ? "Rejected"
                : result.final_evaluation === "Amber"
                ? "Under Review"
                : "Accepted";

            // Save result to history
            applicationHistory.push({
              id: result.applicant_id,
              date: new Date().toLocaleDateString("en-US", {
                year: "numeric",
                month: "short",
                day: "numeric",
              }),
              risk: result.final_evaluation,
              score: result.approval_prediction_pct,
              status: status,
              color:
                result.final_evaluation === "Low"
                  ? "green"
                  : result.final_evaluation === "Amber"
                  ? "yellow"
                  : "red",
            });

            showTemporaryMessage(
              "Risk Analysis Complete! Check the Evaluation page.",
              "green"
            );
            await renderPage("RiskEvaluation");
          } catch (error) {
            console.error("Evaluation Error:", error);
            showTemporaryMessage(
              "Evaluation failed. Check console for details.",
              "red"
            );
          } finally {
            // Reset button state
            submitButton.innerHTML =
              '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>Run Risk Evaluation';
            submitButton.disabled = false;
          }
        }, 1500); // Simulate API latency
      }

      function showTemporaryMessage(message, type) {
        const color =
          type === "green"
            ? "bg-green-500 text-white"
            : type === "blue"
            ? "bg-indigo-500 text-white"
            : "bg-red-500 text-white";

        const messageHtml =
          "" +
          '<div id="temp-message" class="fixed top-20 right-10 z-50 p-4 rounded-lg shadow-xl ' +
          color +
          ' transition-opacity duration-300 transform translate-x-0" role="alert">' +
          '<p class="font-medium">' +
          message +
          "</p>" +
          "</div>";
        document.body.insertAdjacentHTML("afterbegin", messageHtml);

        setTimeout(() => {
          const tempMsg = document.getElementById("temp-message");
          if (tempMsg) {
            tempMsg.style.opacity = "0";
            setTimeout(() => tempMsg.remove(), 300);
          }
        }, 3000);
      }

      // Make showTemporaryMessage globally available for API integration
      window.showTemporaryMessage = showTemporaryMessage;

      // Dashboard refresh functionality
      async function refreshDashboardData() {
        showTemporaryMessage("Refreshing dashboard data...", "blue");

        try {
          // Try to refresh from backend first
          if (typeof refreshDashboardStats === "function") {
            const refreshedStats = await refreshDashboardStats();
            if (refreshedStats) {
              backendDashboardStats = refreshedStats;
              showTemporaryMessage(
                "Dashboard data refreshed from backend!",
                "green"
              );
            } else {
              throw new Error("Backend refresh failed");
            }
          } else {
            // Fallback to reinitializing if available
            if (typeof initializeDashboardStats === "function") {
              const initializedStats = await initializeDashboardStats();
              if (initializedStats) {
                backendDashboardStats = initializedStats;
                showTemporaryMessage(
                  "Dashboard data initialized from backend!",
                  "green"
                );
              } else {
                throw new Error("Backend initialization failed");
              }
            } else {
              throw new Error("Backend functions not available");
            }
          }

          // Re-render the dashboard with new data
          await renderPage("Dashboard");
        } catch (error) {
          console.error("Error refreshing dashboard:", error);
          showTemporaryMessage("Using local data calculations", "yellow");

          // Re-render with local data
          backendDashboardStats = null;
          await renderPage("Dashboard");
        }
      }

      // Initialize dashboard data on first load
      async function initializeDashboardIfNeeded() {
        if (
          !backendDashboardStats &&
          typeof initializeDashboardStats === "function"
        ) {
          try {
            const stats = await initializeDashboardStats();
            if (stats) {
              backendDashboardStats = stats;
              console.log("Dashboard initialized with backend data");
            }
          } catch (error) {
            console.error("Error initializing dashboard:", error);
          }
        }
      }

      // --- Initialization ---
      document.addEventListener("DOMContentLoaded", () => {
        // Check if API integration is loaded
        console.log("DOMContentLoaded - Checking API functions:");
        console.log(
          "handleFileSelectionAPI available:",
          typeof handleFileSelectionAPI
        );
        console.log(
          "showClientDataFromBackend available:",
          typeof showClientDataFromBackend
        );
        console.log(
          "testBackendConnection available:",
          typeof testBackendConnection
        );
        console.log(
          "getDashboardStatsFromBackend available:",
          typeof getDashboardStatsFromBackend
        );

        // Attach click listeners to all menu items using data-page attribute
        document.querySelectorAll(".menu-item").forEach((item) => {
          item.addEventListener("click", async (e) => {
            e.preventDefault();
            const page = item.getAttribute("data-page");
            if (page) {
              await renderPage(page);
            }
          });
        });

        // Initialize dashboard data if backend is available
        initializeDashboardIfNeeded();

        // Initial render
        renderPage("Dashboard");
      });
    </script>
  </body>
</html>
